services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.1
    container_name: nexus-shield-otel-collector
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
