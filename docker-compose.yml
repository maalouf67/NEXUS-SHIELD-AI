services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-shield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: nexus-shield-adminer
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.5.4
    container_name: nexus-shield-clamav
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav_database:/var/lib/clamav
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --host=127.0.0.1 --port=3310 --no-summary /etc/hostname >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 180s

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    container_name: nexus-shield-ai
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      NEXUS_SERVICE_API_TOKEN: ${NEXUS_SERVICE_API_TOKEN:-}
      NEXUS_QUARANTINE_DIR: /var/lib/nexus/quarantine
      NEXUS_MAX_UPLOAD_BYTES: ${NEXUS_MAX_UPLOAD_BYTES:-104857600}
      CLAMDSCAN_BIN: clamdscan
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    ports:
      - '127.0.0.1:8001:8001'
    volumes:
      - nexus_quarantine:/var/lib/nexus/quarantine
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  clamav_database:
  nexus_quarantine:
