services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-shield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10


  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:v4.6.4
    container_name: nexus-shield-mobsf
    profiles: ["reverse-engineering"]
    restart: unless-stopped
    environment:
      DJANGO_SUPERUSER_USERNAME: ${MOBSF_USERNAME:?Set MOBSF_USERNAME in the local .env file}
      DJANGO_SUPERUSER_PASSWORD: ${MOBSF_PASSWORD:?Set MOBSF_PASSWORD in the local .env file}
      MOBSF_API_KEY_FILE: /run/secrets/mobsf_api_key
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - mobsf_data:/home/mobsf/.MobSF
    secrets:
      - mobsf_api_key
    mem_limit: 4g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/login/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  adminer:
    image: adminer:latest
    container_name: nexus-shield-adminer
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy


  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.1
    container_name: nexus-shield-otel-collector
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  clamav:
    image: clamav/clamav:1.5.4
    container_name: nexus-shield-clamav
    restart: unless-stopped
    mem_limit: 4g
    environment:
      CLAMD_STARTUP_TIMEOUT: "1800"
    expose:
      - "3310"
    volumes:
      - clamav_database:/var/lib/clamav
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=3:1 --no-summary >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 5
      # ClamAV may need a long first startup to initialize/update signatures.
      # Keep failures inside this grace period from marking the container unhealthy.
      start_period: 25m

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    container_name: nexus-shield-ai
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      NEXUS_SERVICE_API_TOKEN: ${NEXUS_SERVICE_API_TOKEN:-}
      NEXUS_QUARANTINE_DIR: /var/lib/nexus/quarantine
      NEXUS_MAX_UPLOAD_BYTES: ${NEXUS_MAX_UPLOAD_BYTES:-104857600}
      CLAMDSCAN_BIN: clamdscan
      CLAMDSCAN_CONFIG_FILE: /etc/clamav/clamdscan.conf
    ports:
      - '127.0.0.1:8001:8001'
    volumes:
      - nexus_quarantine:/var/lib/nexus/quarantine
      - ./infra/clamav/clamdscan.conf:/etc/clamav/clamdscan.conf:ro
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

secrets:
  mobsf_api_key:
    file: ${MOBSF_API_KEY_FILE:?Set MOBSF_API_KEY_FILE to a protected local secret file}

volumes:
  postgres_data:
  clamav_database:
  nexus_quarantine:
  mobsf_data:
