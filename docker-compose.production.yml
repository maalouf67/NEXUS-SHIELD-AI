name: nexus-shield-ai

x-database-environment: &database-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
  DATABASE_SSL: "false"

x-api-environment: &api-environment
  <<: *database-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "4000"
  TRUST_PROXY_HOPS: "0"
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env.production}
  AI_BASE_URL: http://ai:8001
  NEXUS_SERVICE_API_TOKEN: ${NEXUS_SERVICE_API_TOKEN:?Set NEXUS_SERVICE_API_TOKEN in .env.production}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  RATE_LIMIT_HASH_SECRET: ${RATE_LIMIT_HASH_SECRET:-}
  NEXUS_EVENT_INGESTION_TOKEN: ${NEXUS_EVENT_INGESTION_TOKEN:-}
  IPQS_API_KEY: ${IPQS_API_KEY:-}
  IPQS_PHONE_STRICTNESS: ${IPQS_PHONE_STRICTNESS:-0}
  SEON_API_KEY: ${SEON_API_KEY:-}
  SEON_PHONE_API_URL: ${SEON_PHONE_API_URL:-}
  ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
  ABUSEIPDB_MAX_AGE_DAYS: ${ABUSEIPDB_MAX_AGE_DAYS:-90}
  ABUSEIPDB_DAILY_LIMIT: ${ABUSEIPDB_DAILY_LIMIT:-850}
  ALLOWED_ORIGINS: https://${NEXUS_DOMAIN:?Set NEXUS_DOMAIN in .env.production}
  OTEL_ENABLED: "false"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  clamav:
    image: clamav/clamav:1.5.4
    restart: unless-stopped
    mem_limit: 4g
    environment:
      CLAMD_STARTUP_TIMEOUT: "1800"
    volumes:
      - clamav_database:/var/lib/clamav
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=3:1 --no-summary >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 25m
    networks: [app]

  ai:
    image: ghcr.io/maalouf67/nexus-shield-ai-ai:${NEXUS_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NEXUS_SERVICE_API_TOKEN: ${NEXUS_SERVICE_API_TOKEN:?Set NEXUS_SERVICE_API_TOKEN in .env.production}
      NEXUS_QUARANTINE_DIR: /var/lib/nexus/quarantine
      NEXUS_MAX_UPLOAD_BYTES: ${NEXUS_MAX_UPLOAD_BYTES:-104857600}
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    volumes:
      - nexus_quarantine:/var/lib/nexus/quarantine
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [app]

  migrate:
    image: ghcr.io/maalouf67/nexus-shield-ai-api:${NEXUS_IMAGE_TAG:-latest}
    restart: "no"
    command: ["node", "services/api/dist/scripts/migrate-database.js"]
    environment:
      <<: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  api:
    image: ghcr.io/maalouf67/nexus-shield-ai-api:${NEXUS_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *api-environment
    expose: ["4000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [app]

  web:
    image: ghcr.io/maalouf67/nexus-shield-ai-web:${NEXUS_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      API_BASE_URL: http://api:4000
    expose: ["3000"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [edge, app]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      NEXUS_DOMAIN: ${NEXUS_DOMAIN:?Set NEXUS_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]

volumes:
  postgres_data:
  clamav_database:
  nexus_quarantine:
  caddy_data:
  caddy_config:

networks:
  edge:
  app:
