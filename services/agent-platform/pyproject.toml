[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-agent-platform"
version = "0.1.0"
description = "NEXUS SHIELD AI multi-agent execution foundation"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "nats-py>=2.9,<3",
  "temporalio>=1.9,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
