# NEXUS SHIELD AI ClamAV daemon settings.
# Port 3310 is reachable only on the private Docker Compose network.
# Do not publish this port to the host or an untrusted network.
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
User clamav
LogTime yes

# Permit the configured 100 MiB upload limit plus protocol overhead.
StreamMaxLength 110M
MaxFileSize 110M

# Bound archive expansion and nested-container processing.
MaxScanSize 300M
MaxRecursion 16
MaxFiles 10000
