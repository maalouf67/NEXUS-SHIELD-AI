name: Threat intelligence analytics

on:
  pull_request:
    branches: [main]
    paths:
      - 'database/init/**'
      - 'services/api/**'
      - 'services/analytics-r/**'
      - '.github/workflows/threat-intelligence.yml'
  push:
    branches: [feat/threat-intelligence-predictive-analytics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-and-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_ci_only
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nexus:nexus_ci_only@localhost:5432/nexus_test
      DATABASE_SSL: 'false'
      JWT_SECRET: nexus-ci-test-secret-at-least-thirty-two-characters
      NODE_ENV: test
      NEXUS_RUN_DB_INTEGRATION_TESTS: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build API
        run: npm run build --workspace @nexus-shield/api
      - name: Apply all numbered PostgreSQL migrations
        run: npm run db:migrate --workspace @nexus-shield/api
      - name: Test API including PostgreSQL integration
        run: npm test --workspace @nexus-shield/api

  r-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Run R analytics tests
        run: Rscript services/analytics-r/tests/test_threat_analytics.R
