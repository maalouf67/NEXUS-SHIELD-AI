name: NEXUS SHIELD AI - Build and Test

on:
  push:
    branches: ["main", "feature/**", "feat/**"]
  pull_request:
    branches: ["main", "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-web:
    name: Node.js build and API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: nexus_test_password
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_test -d nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexus_test:nexus_test_password@127.0.0.1:5432/nexus_test
      DATABASE_SSL: "false"
      NEXUS_RUN_DB_INTEGRATION: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies for high-severity advisories
        run: npm audit --audit-level=high

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply database migrations with the application migration runner
        run: npm run db:migrate

      - name: Verify migration idempotency, PostgreSQL connectivity and schema
        run: |
          second_run="$(npm run db:migrate 2>&1)"
          echo "$second_run"
          echo "$second_run" | grep -F "0 applied, 13 already current, 13 total"
          npm run db:check
          tables="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT to_regclass('public.api_rate_limit_counters')::text || ',' || to_regclass('public.auth_sessions')::text || ',' || to_regclass('public.workspaces')::text || ',' || to_regclass('public.workspace_memberships')::text || ',' || to_regclass('public.workspace_integrations')::text || ',' || to_regclass('public.apple_identities')::text || ',' || to_regclass('public.auth_refresh_token_families')::text || ',' || to_regclass('public.auth_refresh_tokens')::text")"
          test "$tables" = "api_rate_limit_counters,auth_sessions,workspaces,workspace_memberships,workspace_integrations,apple_identities,auth_refresh_token_families,auth_refresh_tokens"
          migration_count="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM nexus_schema_migrations")"
          test "$migration_count" = "13"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $nexus_assertions$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid = 'public.apple_identities'::regclass
                AND conname = 'pk_apple_identities' AND contype = 'p'
            ) THEN
              RAISE EXCEPTION 'Apple identity provider/subject primary key is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid = 'public.auth_refresh_token_families'::regclass
                AND conname = 'fk_auth_refresh_families_session_user' AND contype = 'f'
            ) THEN
              RAISE EXCEPTION 'Refresh family is not bound to its owning access session and user';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid = 'public.auth_refresh_tokens'::regclass
                AND conname = 'uq_auth_refresh_tokens_token_hash' AND contype = 'u'
            ) THEN
              RAISE EXCEPTION 'Refresh token hashes are not unique';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid = 'public.auth_refresh_tokens'::regclass
                AND conname = 'chk_auth_refresh_tokens_hash' AND contype = 'c'
            ) THEN
              RAISE EXCEPTION 'Refresh token hash format constraint is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid = 'public.auth_refresh_tokens'::regclass
                AND conname = 'fk_auth_refresh_tokens_family_parent' AND contype = 'f'
            ) THEN
              RAISE EXCEPTION 'Refresh-token parent is not constrained to the same family';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname = 'public'
                AND indexname = 'idx_auth_refresh_tokens_active_expiry'
            ) THEN
              RAISE EXCEPTION 'Active refresh-token expiry index is missing';
            END IF;

            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'auth_refresh_tokens'
                AND column_name IN ('token', 'raw_token', 'refresh_token')
            ) THEN
              RAISE EXCEPTION 'Raw refresh-token column must never be persisted';
            END IF;
          END $nexus_assertions$;
          SQL
          echo "PostgreSQL connection verified and all 13 numbered migrations are recorded."

      - name: Build web and API workspaces
        run: npm run build

      - name: Run API tests
        run: npm test

      - name: Type-check API
        run: npm run lint --workspace @nexus-shield/api

  python-ai:
    name: Python AI service validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install AI service dependencies
        run: python -m pip install -r services/ai/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q services/ai
      - name: Run Python scanner adapter tests
        env:
          PYTHONPATH: services/ai
        run: python -m unittest discover -s services/ai/tests -v


  android-build:
    name: Android companion debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Build Android debug APK
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Run Android DNS packet codec unit tests
        working-directory: apps/android
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Upload development APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-shield-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  mobile-security-governance:
    name: MASVS / MASTG control register completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify documented mobile control groups
        shell: bash
        run: |
          set -euo pipefail
          register="docs/mobile-security/MASVS_MASTG_CONTROL_REGISTER.md"
          test -s "$register"
          for group in STORAGE CRYPTO AUTH NETWORK PLATFORM CODE RESILIENCE PRIVACY; do
            grep -q "MASVS-$group" "$register"
          done
          grep -q "NOT VERIFIED" "$register"
          echo "MASVS/MASTG register is present and complete."
          echo "This documentation gate is not a mobile security scan or compliance attestation."

  clamav-integration:
    name: Real Docker, ClamAV and web upload integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start PostgreSQL, ClamAV and NEXUS AI containers
        env:
          POSTGRES_DB: nexus_ci
          POSTGRES_USER: nexus_ci
          POSTGRES_PASSWORD: nexus_ci_password
          NEXUS_SERVICE_API_TOKEN: nexus-ci-only-service-token-please-never-reuse
          OPENAI_API_KEY: ""
        run: |
          docker compose up -d postgres clamav
          for attempt in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U nexus_ci -d nexus_ci >/dev/null 2>&1; then
              echo "PostgreSQL is ready."
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs postgres
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 360); do
            state="$(docker inspect --format '{{.State.Health.Status}}' nexus-shield-clamav 2>/dev/null || true)"
            if [ "$state" = "healthy" ]; then
              echo "ClamAV daemon is healthy."
              break
            fi
            if [ "$attempt" -eq 360 ]; then
              echo "ClamAV container diagnostics:" >&2
              docker compose ps -a >&2 || true
              docker compose logs --no-color --tail 300 clamav >&2 || true
              docker inspect --format '{{json .State}} {{json .State.Health}}' nexus-shield-clamav >&2 || true
              echo "ClamAV did not become healthy within the 30-minute startup allowance." >&2
              exit 1
            fi
            sleep 5
          done
          docker compose up -d --build ai
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/health >/dev/null; then
              echo "NEXUS AI scanner is healthy."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs ai
              echo "NEXUS AI scanner did not become healthy." >&2
              exit 1
            fi
            sleep 2
          done
          docker compose exec -T ai python -c "import socket; s=socket.create_connection(('clamav', 3310), timeout=3); s.sendall(b'zPING\\0'); response=s.recv(64); s.close(); assert response == b'PONG\\0', response; print('ClamAV INSTREAM TCP service is reachable')"

      - name: Verify Compose migrations and seed isolated test users
        env:
          DATABASE_URL: postgresql://nexus_ci:nexus_ci_password@127.0.0.1:5432/nexus_ci
          PGPASSWORD: nexus_ci_password
        run: |
          for attempt in $(seq 1 60); do
            if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT to_regclass('public.malware_scan_runs')" | grep -q malware_scan_runs; then
              echo "PostgreSQL migrations completed."
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs postgres
              echo "Malware scan history migration was not applied." >&2
              exit 1
            fi
            sleep 2
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (id, email, role, password_hash, is_active)
          VALUES
            ('00000000-0000-4000-8000-000000000001', 'scan-admin@example.test', 'admin', NULL, TRUE),
            ('00000000-0000-4000-8000-000000000002', 'scan-viewer@example.test', 'viewer', NULL, TRUE);

          INSERT INTO auth_sessions (id, user_id, expires_at)
          VALUES
            ('00000000-0000-4000-8000-000000000011', '00000000-0000-4000-8000-000000000001', NOW() + INTERVAL '30 minutes'),
            ('00000000-0000-4000-8000-000000000022', '00000000-0000-4000-8000-000000000002', NOW() + INTERVAL '30 minutes');
          SQL

      - name: Start the API and Next.js web console
        env:
          NODE_ENV: development
          PORT: "4000"
          HOST: "127.0.0.1"
          DATABASE_URL: postgresql://nexus_ci:nexus_ci_password@127.0.0.1:5432/nexus_ci
          DATABASE_SSL: "false"
          JWT_SECRET: nexus-ci-only-jwt-secret-never-reuse-123456789
          SESSION_SECRET: nexus-ci-only-session-secret-never-reuse-123456789
          NEXUS_SERVICE_API_TOKEN: nexus-ci-only-service-token-please-never-reuse
          AI_BASE_URL: http://127.0.0.1:8001
          API_BASE_URL: http://127.0.0.1:4000
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run dev --workspace @nexus-shield/api > /tmp/nexus-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              echo "NEXUS API is ready."
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/nexus-api.log
              exit 1
            fi
            sleep 2
          done
          npm run dev --workspace @nexus-shield/web > /tmp/nexus-web.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              echo "Next.js web console is ready."
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              cat /tmp/nexus-web.log
              exit 1
            fi
            sleep 2
          done

      - name: Scan a benign file through the Next.js web upload gateway
        env:
          JWT_SECRET: nexus-ci-only-jwt-secret-never-reuse-123456789
        run: |
          TOKEN="$(node -e "const jwt=require('jsonwebtoken'); process.stdout.write(jwt.sign({jti:'00000000-0000-4000-8000-000000000011'}, process.env.JWT_SECRET, {algorithm:'HS256',subject:'00000000-0000-4000-8000-000000000001',issuer:'nexus-shield-ai',audience:'nexus-shield-ai-api',expiresIn:'15m'}))")"
          printf '%s\n' 'NEXUS SHIELD AI benign web gateway test fixture.' > /tmp/nexus-clean.txt
          HTTP_STATUS="$(curl --silent --show-error --output /tmp/nexus-clean-result.json --write-out '%{http_code}' \
            -H "Cookie: nexus_access_token=$TOKEN" \
            -H "Origin: http://127.0.0.1:3000" \
            -F "file=@/tmp/nexus-clean.txt;filename=benign.txt" \
            http://127.0.0.1:3000/api/security/scan)"
          echo "Benign upload gateway HTTP status: $HTTP_STATUS"
          cat /tmp/nexus-clean-result.json
          test "$HTTP_STATUS" = "200"
          python -c "import json; d=json.load(open('/tmp/nexus-clean-result.json')); assert d['scan']['verdict'] == 'clean', d; assert d['history_persisted'] is True, d; print('Web gateway benign scan: clean; history saved')"

      - name: Detect the harmless EICAR test string through the web gateway
        env:
          JWT_SECRET: nexus-ci-only-jwt-secret-never-reuse-123456789
        run: |
          TOKEN="$(node -e "const jwt=require('jsonwebtoken'); process.stdout.write(jwt.sign({jti:'00000000-0000-4000-8000-000000000011'}, process.env.JWT_SECRET, {algorithm:'HS256',subject:'00000000-0000-4000-8000-000000000001',issuer:'nexus-shield-ai',audience:'nexus-shield-ai-api',expiresIn:'15m'}))")"
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/eicar.com
          curl --fail --silent --show-error \
            -H "Cookie: nexus_access_token=$TOKEN" \
            -H "Origin: http://127.0.0.1:3000" \
            -F "file=@/tmp/eicar.com;filename=eicar.com" \
            http://127.0.0.1:3000/api/security/scan > /tmp/nexus-eicar-result.json
          python -c "import json; d=json.load(open('/tmp/nexus-eicar-result.json')); assert d['scan']['verdict'] == 'detected', d; assert d['history_persisted'] is True, d; print('Web gateway EICAR scan: detected; history saved')"

      - name: Verify owner-scoped scan history from the web gateway
        env:
          JWT_SECRET: nexus-ci-only-jwt-secret-never-reuse-123456789
        run: |
          ADMIN_TOKEN="$(node -e "const jwt=require('jsonwebtoken'); process.stdout.write(jwt.sign({jti:'00000000-0000-4000-8000-000000000011'}, process.env.JWT_SECRET, {algorithm:'HS256',subject:'00000000-0000-4000-8000-000000000001',issuer:'nexus-shield-ai',audience:'nexus-shield-ai-api',expiresIn:'15m'}))")"
          VIEWER_TOKEN="$(node -e "const jwt=require('jsonwebtoken'); process.stdout.write(jwt.sign({jti:'00000000-0000-4000-8000-000000000022'}, process.env.JWT_SECRET, {algorithm:'HS256',subject:'00000000-0000-4000-8000-000000000002',issuer:'nexus-shield-ai',audience:'nexus-shield-ai-api',expiresIn:'15m'}))")"
          curl --fail --silent --show-error \
            -H "Cookie: nexus_access_token=$ADMIN_TOKEN" \
            http://127.0.0.1:3000/api/security/scan?limit=10 > /tmp/nexus-admin-history.json
          curl --fail --silent --show-error \
            -H "Cookie: nexus_access_token=$VIEWER_TOKEN" \
            http://127.0.0.1:3000/api/security/scan?limit=10 > /tmp/nexus-viewer-history.json
          python -c "import json; a=json.load(open('/tmp/nexus-admin-history.json')); v=json.load(open('/tmp/nexus-viewer-history.json')); assert a['pagination']['total'] == 2, a; assert {x['verdict'] for x in a['scans']} == {'clean','detected'}, a; assert v['pagination']['total'] == 0, v; print('Owner isolation: admin sees two scans; another user sees none')"

      - name: Stop test containers and remove test volumes
        if: always()
        env:
          POSTGRES_DB: nexus_ci
          POSTGRES_USER: nexus_ci
          POSTGRES_PASSWORD: nexus_ci_password
          NEXUS_SERVICE_API_TOKEN: nexus-ci-only-service-token-please-never-reuse
          OPENAI_API_KEY: ""
        run: docker compose down --volumes --remove-orphans
