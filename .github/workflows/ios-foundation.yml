name: iOS Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate --spec project.yml
      - name: Select an available iPhone Simulator
        id: simulator
        shell: bash
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone Simulator device was found on this runner." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Build and run XCTest on Simulator
        working-directory: apps/ios
        run: |
          xcodebuild \
            -project NexusShield.xcodeproj \
            -scheme NexusShield \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath "$RUNNER_TEMP/NexusShieldDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test
