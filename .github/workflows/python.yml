name: NEXUS SHIELD AI - Python Service Checks

on:
  push:
    branches: ["main"]
    paths:
      - "services/ai/**"
      - ".github/workflows/python.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "services/ai/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-ai:
    name: Python 3.11 AI service validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ai/requirements.txt
      - name: Install AI service requirements
        run: python -m pip install -r services/ai/requirements.txt
      - name: Compile service sources
        run: python -m compileall -q services/ai
      - name: Run scanner adapter tests
        env:
          PYTHONPATH: services/ai
        run: python -m unittest discover -s services/ai/tests -v